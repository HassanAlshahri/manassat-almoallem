<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة المعلم — التقارير</title>
<style>
:root{--main:#176b5b;--green:#176b5b;--bg:#f5f7f6;--line:#d8e1de;--soft:#eaf3f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17332d}
header{background:var(--main);color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}.school{margin-top:5px;font-size:15px;font-weight:bold;opacity:.96}
h1{margin:0;font-size:24px}.teacher{margin-top:5px;font-size:14px}
main{max-width:1280px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #00000010}
.title{font-size:20px;font-weight:bold;margin:10px 0 15px}.sub{color:#687772;font-size:13px;margin-top:5px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.class-card{cursor:pointer}.class-card:hover{outline:2px solid #b8d2ca}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--main);color:#fff;font-size:15px;cursor:pointer}
button.secondary{background:#e7efec;color:#17332d}button.danger{background:#a93737}button.absent{background:#b84a4a}button.late{background:#b88628}
input,select{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px;width:100%;min-width:58px;text-align:center;background:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{width:auto;min-width:170px;text-align:right}
.tabs{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.tab{background:#e7efec;color:#17332d}.tab.active{background:var(--main);color:#fff}
.table-wrap{overflow:auto;background:#fff;border-radius:14px;box-shadow:0 2px 8px #00000010}table{border-collapse:collapse;min-width:1180px;width:100%}
th,td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;z-index:1}.name-cell{min-width:180px;text-align:right;font-weight:bold;position:sticky;right:0;background:#fff;z-index:2}th.name-cell{background:var(--soft);z-index:3}
.total{font-weight:bold;background:#f0f6f4}.short-test{background:#fff3e0!important;border-color:#e8c98d!important}.short-head{background:#f6dfb8!important}.empty{text-align:center;padding:35px;color:#687772}
.attendance-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.statuses{display:flex;gap:6px;flex-wrap:wrap}.status{background:#e7efec;color:#17332d;padding:8px 11px}.status.selected-present{background:var(--main);color:#fff}.status.selected-absent{background:#b84a4a;color:#fff}.status.selected-late{background:#b88628;color:#fff}
.summary{display:flex;gap:10px;flex-wrap:wrap}.summary div{padding:10px 15px;border-radius:10px;background:#eef5f2;font-weight:bold}
.report-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.report-choice .card{cursor:pointer;border:1px solid var(--line)}.report-choice .card:hover{outline:2px solid #b8d2ca}
.footer{text-align:center;color:#687772;font-size:13px;margin:22px}
.report-sheet{background:#fff;color:#111;max-width:1000px;margin:auto;padding:35px;direction:rtl}.report-head{text-align:center;border-bottom:2px solid #176b5b;padding-bottom:15px;margin-bottom:20px}.report-head h2{margin:0 0 8px}.report-table{width:100%;min-width:0}.report-table th,.report-table td{border:1px solid #555;padding:7px;position:static;background:#fff;color:#111}.report-table th{background:#eee}.signatures{display:flex;justify-content:space-between;gap:30px;margin-top:45px;text-align:center}.sig{min-width:220px}.sig-line{border-top:1px solid #444;margin-top:35px;padding-top:7px}
@media(max-width:600px){main{padding:10px}.attendance-row{grid-template-columns:1fr}.toolbar input{width:100%}.signatures{flex-direction:column}.report-sheet{padding:18px}}
@media print{body{background:#fff}header,main{display:none}.print-only{display:block!important}.report-sheet{box-shadow:none;padding:15px;max-width:none}.no-print{display:none!important}}

/* وضع الآيفون: نفس واجهة الكمبيوتر مع الحفاظ على جميع الأقسام في الصفحة */
@media(max-width:700px){
  body{overflow-x:hidden}
  main{padding:7px}
  header{padding:12px 10px}
  .title{font-size:18px}
  .tabs{
    position:sticky;top:0;z-index:15;background:var(--bg);
    display:flex!important;flex-wrap:nowrap!important;overflow-x:auto;
    -webkit-overflow-scrolling:touch;gap:5px;padding:7px 2px;
  }
  .tab{flex:0 0 auto!important;white-space:nowrap;font-size:12px;padding:9px 10px}
  .toolbar{display:flex!important;flex-wrap:wrap;gap:6px}
  .toolbar input{flex:1 1 100%!important;width:100%!important}
  .toolbar button,.toolbar label{flex:1 1 calc(50% - 6px);font-size:12px;padding:9px 7px}
  .table-wrap{
    width:100%;overflow-x:auto!important;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:10px;background:#fff;
  }
  table{min-width:1200px!important}
  th,td{padding:7px 5px!important;font-size:12px}
  input[type=number]{min-width:52px!important;width:58px!important;font-size:16px!important;min-height:42px}
  .name-cell{position:sticky!important;right:0!important;z-index:3;background:#fff;min-width:145px!important;box-shadow:-3px 0 5px #00000012}
  thead .name-cell{z-index:5}
  .summary{grid-template-columns:1fr 1fr!important}
  .summary div{font-size:12px;padding:9px}
  .card{padding:10px;margin:8px 0}
  .classes{grid-template-columns:1fr 1fr!important}
  .class-card{min-height:85px}
  .attendance-row{grid-template-columns:1fr!important}
  .statuses{grid-template-columns:repeat(3,1fr)!important}
  button{min-height:40px}
}


/* تحسينات اللمس مع الحفاظ على واجهة الكمبيوتر */
@media(max-width:700px){
  .table-wrap{scroll-snap-type:x proximity}
  .table-wrap td,.table-wrap th{scroll-snap-align:start}
  input[type=number]{-webkit-appearance:none;appearance:none}
  .desktop-nav{display:flex!important;overflow-x:auto;gap:6px;position:sticky;bottom:0;z-index:30;background:#ffffffee;backdrop-filter:blur(10px);padding:8px;border-top:1px solid var(--line);margin:14px -7px -7px}
  .desktop-nav button{flex:0 0 auto;font-size:12px;min-height:42px;padding:9px 11px}
}
@media(min-width:701px){.desktop-nav{display:none!important}}


/* لوحة ملخص الصف */
.class-dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center}
.metric .n{font-size:22px;font-weight:bold;color:var(--green);margin-top:5px}
@media(max-width:700px){.class-dashboard{grid-template-columns:1fr 1fr}.metric{padding:9px;font-size:12px}.metric .n{font-size:20px}}


/* تمييز صفوف جدول الطلاب بالتناوب لتسهيل القراءة */
.table-wrap tbody tr:nth-child(odd) td{background:#ffffff}
.table-wrap tbody tr:nth-child(even) td{background:#f1f3f2}
.table-wrap tbody tr:nth-child(odd) .name-cell{background:#ffffff}
.table-wrap tbody tr:nth-child(even) .name-cell{background:#f1f3f2}
.table-wrap tbody tr:hover td{background:#e5f0ec!important}
@media(max-width:700px){
 .table-wrap tbody tr:nth-child(odd) .name-cell{background:#ffffff!important}
 .table-wrap tbody tr:nth-child(even) .name-cell{background:#f1f3f2!important}
}


.serial-cell{font-weight:700;text-align:center;min-width:48px}
@media(max-width:700px){
  .serial-cell{position:sticky;right:0;z-index:4;box-shadow:-2px 0 4px #00000012}
  .name-cell{right:48px!important}
  thead .serial-cell{z-index:6}
  .table-wrap tbody tr:nth-child(odd) .serial-cell{background:#ffffff!important}
  .table-wrap tbody tr:nth-child(even) .serial-cell{background:#f1f3f2!important}
}


/* تصغير عمود الرقم التسلسلي */
th.serial-cell,td.serial-cell{
  width:32px!important;
  min-width:32px!important;
  max-width:32px!important;
  padding-right:3px!important;
  padding-left:3px!important;
}
@media(max-width:700px){
  .serial-cell{width:30px!important;min-width:30px!important;max-width:30px!important}
  .name-cell{right:30px!important}
}


/* تحسين تتبع الصف أثناء إدخال الدرجات */
.table-wrap tbody tr:focus-within td{
  background:#e3f0eb!important;
  box-shadow:inset 0 1px 0 #b9d8cd,inset 0 -1px 0 #b9d8cd;
}
.table-wrap tbody tr:focus-within .serial-cell,
.table-wrap tbody tr:focus-within .name-cell{background:#d7ebe3!important}
.student-count-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:#edf5f2;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin:9px 0;font-size:13px
}
.student-count-bar b{font-size:18px;color:var(--green)}
@media(max-width:700px){
 .student-count-bar{font-size:12px}
 .student-count-bar b{font-size:17px}
}


/* مجاميع تلقائية إضافية */
.short-total{font-weight:800;background:#f8ead1!important}
.grand-total{font-weight:900;font-size:16px;background:#dceee8!important;color:#0f5548}
.short-head{white-space:nowrap}
.grand-head{background:#cfe5dc!important;color:#0f5548}


/* بطاقة التاريخ والوقت في الواجهة الرئيسية */
.datetime-card{
  margin:12px auto 18px;
  max-width:760px;
  padding:16px 18px;
  background:linear-gradient(135deg,#176b5b,#23806d);
  color:#fff;
  border-radius:16px;
  box-shadow:0 8px 22px rgba(23,107,91,.18);
  text-align:center;
}
.datetime-day{font-size:20px;font-weight:800;margin-bottom:8px}
.datetime-dates{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.datetime-item{background:rgba(255,255,255,.14);padding:8px 14px;border-radius:10px}
.datetime-label{font-size:11px;opacity:.82;display:block;margin-bottom:3px}
.datetime-value{font-weight:700}
.datetime-time{font-size:26px;font-weight:800;margin-top:12px;letter-spacing:.5px;direction:ltr}


/* التقارير */
.report-sheet{background:#fff;max-width:980px;margin:15px auto;padding:18px;border-radius:14px;box-shadow:0 4px 18px #00000012;color:#111}
.report-actions{display:flex;gap:10px;justify-content:center;margin-bottom:15px}
.report-head{text-align:center;border-bottom:2px solid var(--main);padding-bottom:14px;margin-bottom:16px}
.report-head h2{margin:0 0 6px}.report-sheet .school{font-size:16px;font-weight:700;margin:5px 0}
.report-sheet .printed{font-size:12px;color:#555;margin-top:8px}
.report-table-wrap{width:100%;overflow:hidden}
.report-sheet table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11px}
.report-sheet th,.report-sheet td{border:1px solid #555;padding:5px 2px;text-align:center;color:#111;word-break:break-word;overflow-wrap:anywhere;vertical-align:middle}
.report-sheet th{background:#eee;white-space:normal}
.report-sheet th:first-child,.report-sheet td:first-child{width:4%}
.report-sheet th:nth-child(2),.report-sheet td:nth-child(2){width:22%;text-align:right;padding-right:5px}
.report-sheet .sign{display:flex;justify-content:space-between;gap:30px;margin-top:45px;text-align:center}
.report-sheet .sig{flex:1}.report-sheet .line{border-top:1px solid #333;margin-top:35px;padding-top:7px}
@media(max-width:700px){
 .report-sheet{padding:8px;margin:5px auto}
 .report-actions button{flex:1;font-size:13px}
 .report-sheet table{font-size:8.5px}
 .report-sheet th,.report-sheet td{padding:3px 1px}
 .report-sheet th:nth-child(2),.report-sheet td:nth-child(2){width:20%}
 .report-head h2{font-size:20px}
 .report-sheet .school{font-size:13px}
}
@media print{
 @page{size:auto;margin:10mm}
 body{background:#fff!important}
 body:not(.printing-report) .report-sheet{display:none!important}
 header,main>.tabs,.no-print{display:none!important}
 main{padding:0!important}
 .report-sheet{box-shadow:none!important;margin:0!important;padding:0!important;max-width:none!important;width:100%!important}
 .report-table-wrap{overflow:visible!important;width:100%!important}
 .report-sheet table{width:100%!important;min-width:0!important;table-layout:fixed!important;font-size:9px!important}
 .report-sheet th,.report-sheet td{padding:3px 1px!important}
 thead{display:table-header-group}
 tr{page-break-inside:avoid}
}


.report-main-btn{width:100%;font-size:17px;padding:16px;margin-top:8px}

.report-card-btn{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;color:inherit;cursor:pointer;font:inherit}
.report-card-btn:hover{border-color:var(--main)}
.report-card-btn h3{margin:0 0 6px}

</style>

<body>
  <div style="text-align:center;margin:15px 0;"><button id="drive-sync-btn" onclick="connectGoogleDrive()">☁️ ربط Google Drive</button></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
  const GOOGLE_CLIENT_ID='181382887608-99h18jllkhmkasa5g6n6i4c8idrjn4aq.apps.googleusercontent.com';
  const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
  const DRIVE_FILE_NAME='teacher_platform_data.json';
  let driveTokenClient=null,driveAccessToken=localStorage.getItem('googleDriveAccessToken')||'',driveTokenExpiresAt=Number(localStorage.getItem('googleDriveTokenExpiresAt')||0),pendingDriveAction=null;
  function updateDriveButton(){const b=document.getElementById('drive-sync-btn');if(b)b.textContent=localStorage.getItem('teacherPlatformDriveFileId')?'☁️ Google Drive مرتبط':'☁️ ربط Google Drive'}
  window.addEventListener('load',()=>{if(!window.google||!google.accounts||!google.accounts.oauth2){setTimeout(updateDriveButton,800);return}driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:handleDriveToken});updateDriveButton()});
  function connectGoogleDrive(){pendingDriveAction='connect';requestDriveToken(true)}
  function requestDriveToken(interactive=false){
  if(!driveTokenClient){
    if(window.google&&google.accounts&&google.accounts.oauth2){
      driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:handleDriveToken});
    }else{
      alert('جارٍ تجهيز خدمة Google، انتظر لحظة ثم أعد المحاولة.');
      return;
    }
  }
  if(driveAccessToken&&Date.now()<driveTokenExpiresAt-30000){
    handleDriveToken({access_token:driveAccessToken,expires_in:Math.max(60,Math.floor((driveTokenExpiresAt-Date.now())/1000))});
    return;
  }
  driveTokenClient.requestAccessToken({prompt:interactive?'consent':''});
}
  async function handleDriveToken(r){if(r.error){console.error(r);alert('حدث خطأ أثناء الاتصال بـ Google Drive.');return}driveAccessToken=r.access_token;driveTokenExpiresAt=Date.now()+((r.expires_in||3600)*1000);localStorage.setItem('googleDriveAccessToken',driveAccessToken);localStorage.setItem('googleDriveTokenExpiresAt',String(driveTokenExpiresAt));const a=pendingDriveAction||'connect';pendingDriveAction=null;try{if(a==='connect'){const cloud=await findDriveFile();if(cloud){localStorage.setItem('teacherPlatformDriveFileId',cloud.id);const hasLocal=Object.values(data||{}).some(v=>v&&Array.isArray(v.students)&&v.students.length);if(!hasLocal)await downloadFromGoogleDrive(false);else await syncToGoogleDrive(false)}else await syncToGoogleDrive(false);updateDriveButton();alert('تم ربط Google Drive بنجاح ✅')}else if(a==='upload')await syncToGoogleDrive(false);else if(a==='download')await downloadFromGoogleDrive(true)}catch(e){console.error(e);alert('تعذر إكمال عملية Google Drive. تأكد من اتصال الإنترنت وإعدادات OAuth.')}}
  async function driveFetch(url,opt={}){const h=new Headers(opt.headers||{});h.set('Authorization','Bearer '+driveAccessToken);const r=await fetch(url,{...opt,headers:h});if(!r.ok)throw new Error(await r.text());return r}
  async function findDriveFile(){const q=encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);const r=await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);const j=await r.json();return j.files&&j.files[0]||null}
  function buildDrivePayload(){return{app:'منصة المعلم',version:'2.0',modifiedAt:localStorage.getItem('teacherPlatformLastModified')||new Date().toISOString(),exportedAt:new Date().toISOString(),data:data}}
  async function uploadDriveFile(id){const meta={name:DRIVE_FILE_NAME,mimeType:'application/json'},b='teacher_platform_'+Date.now(),body=[`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(meta),`\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(buildDrivePayload()),`\r\n--${b}--`].join('');const url=id?`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';const r=await driveFetch(url,{method:id?'PATCH':'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},body});const j=await r.json();localStorage.setItem('teacherPlatformDriveFileId',j.id);localStorage.setItem('teacherPlatformLastSync',new Date().toISOString());return j}
  async function syncToGoogleDrive(show=true){
  if(!driveAccessToken||Date.now()>=driveTokenExpiresAt-30000){
    pendingDriveAction='upload';
    requestDriveToken(false);
    return;
  }
  let id=localStorage.getItem('teacherPlatformDriveFileId');
  if(!id){const f=await findDriveFile();id=f&&f.id||''}
  await uploadDriveFile(id);
  if(show)alert('تم رفع أحدث البيانات إلى Google Drive بنجاح ☁️');
  refreshSyncStatus();
}
  async function downloadFromGoogleDrive(show=true){if(!driveAccessToken||Date.now()>=driveTokenExpiresAt-30000){pendingDriveAction='download';requestDriveToken(false);return}let id=localStorage.getItem('teacherPlatformDriveFileId');if(!id){const f=await findDriveFile();id=f&&f.id}if(!id){alert('لا توجد نسخة محفوظة على Google Drive بعد.');return}const r=await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`),p=await r.json();if(!p.data)throw new Error('invalid cloud data');data=p.data;classes.forEach(c=>{data[c]??={students:[],attendance:{}};data[c].students??=[];data[c].attendance??={};});localStorage.setItem('teacherPlatformReports',JSON.stringify(data));localStorage.setItem('teacherPlatformLastModified',p.modifiedAt||new Date().toISOString());localStorage.setItem('teacherPlatformDriveFileId',id);localStorage.setItem('teacherPlatformLastSync',new Date().toISOString());if(show)alert('تم تحميل بياناتك من Google Drive بنجاح ☁️');refreshSyncStatus();home()}
  function manualDriveUpload(){pendingDriveAction='upload';requestDriveToken(false)}
  function manualDriveDownload(){if(!confirm('سيتم استبدال البيانات الموجودة على هذا الجهاز بالنسخة المحفوظة في Google Drive. هل تريد المتابعة؟'))return;pendingDriveAction='download';requestDriveToken(false)}
  </script>
<header><h1>منصة المعلم</h1><div class="school">مدرسة / الراشدون الابتدائية والمتوسطة بالمربع</div><div class="teacher">الأستاذ حسن يحيى الشهري</div></header>
<div id="mainDateTime" class="datetime-card">
  <div id="weekday" class="datetime-day">—</div>
  <div class="datetime-dates">
    <div class="datetime-item"><span class="datetime-label">التاريخ الهجري</span><span id="hijriDate" class="datetime-value">—</span></div>
    <div class="datetime-item"><span class="datetime-label">التاريخ الميلادي</span><span id="gregorianDate" class="datetime-value">—</span></div>
  </div>
  <div id="currentTime" class="datetime-time">—</div>
</div>
<main id="app"></main>
<script>
const classes=['الصف الأول المتوسط أ','الصف الأول المتوسط ب','الصف الثاني المتوسط أ','الصف الثاني المتوسط ب'];
let data=JSON.parse(localStorage.getItem('teacherPlatformReports')||'{}');
classes.forEach(c=>{data[c]??={students:[],attendance:{}};data[c].students??=[];data[c].attendance??={};});
const save=()=>{
 const now=new Date().toISOString();
 localStorage.setItem('teacherPlatformReports',JSON.stringify(data));
 localStorage.setItem('teacherPlatformLastModified',now);
 if(autoSyncEnabled) queueAutoSync();
};
const app=document.getElementById('app');
const today=()=>new Date().toISOString().slice(0,10);
let currentTab='grades';
let autoSyncEnabled=localStorage.getItem('teacherPlatformAutoSync')==='true';

function home(){updateDriveButton();app.innerHTML=`<div class="title">صفوفي الدراسية</div><div class="classes">${classes.map(c=>`<div class="card class-card" onclick="openClass('${c}')"><b>${c}</b><div class="sub">${data[c].students.length} طالب</div></div>`).join('')}</div><div class="footer">نسخة تجريبية — الدرجات والحضور والتقارير</div>`}

function openClass(c){
 app.innerHTML=`<button class="secondary" onclick="home()">← الصفوف</button><div class="title">${c}</div>
<div class="desktop-nav">
 <button class="secondary" onclick="switchTab('${c}','grades')">📊 الدرجات</button>
 <button class="secondary" onclick="switchTab('${c}','attendance')">📅 الحضور</button>
 <button class="secondary" onclick="switchTab('${c}','reports')">📄 التقارير</button>
 <button class="secondary" onclick="switchTab('${c}','stats')">📈 الإحصاءات</button>
 <button class="secondary" onclick="switchTab('${c}','sync')">☁️ المزامنة</button>
 <button class="secondary" onclick="switchTab('${c}','settings')">⚙️ الإعدادات</button>
</div>
 <div class="tabs"><button class="tab ${currentTab==='grades'?'active':''}" onclick="switchTab('${c}','grades')">📊 الدرجات</button>

function setShort(c,i,x,v){data[c].students[i].short??=[null,null,null,null];data[c].students[i].short[x]=v===''?null:Math.max(0,Math.min(10,Number(v)));save()}

function removeStudent(c,i){

   data[c].students.splice(i,1);

   Object.keys(data[c].attendance).forEach(date=>{
     const old=data[c].attendance[date]||{};

function recalc(c){data[c].students.forEach((s,i)=>{s.abs=0;s.late=0;Object.values(data[c].attendance).forEach(day=>{if(day[i]==='absent')s.abs++;if(day[i]==='late')s.late++;})})}

function getUsageSeconds(){
 const total=Number(localStorage.getItem('teacherPlatformUsageSeconds')||0);
 const sessionStart=Number(sessionStorage.getItem('teacherPlatformSessionStart')||Date.now());
 return total+Math.floor((Date.now()-sessionStart)/1000);
}
function formatDuration(total){
 total=Math.max(0,Math.floor(total));
 const days=Math.floor(total/86400); total%=86400;
 const hours=Math.floor(total/3600); total%=3600;
 const minutes=Math.floor(total/60); const seconds=total%60;
 return `${String(days).padStart(2,'0')} يوم : ${String(hours).padStart(2,'0')} ساعة : ${String(minutes).padStart(2,'0')} دقيقة : ${String(seconds).padStart(2,'0')} ثانية`;
}
function formatDateTime(iso){
 if(!iso)return 'لا توجد تعديلات مسجلة بعد';
 const d=new Date(iso);
 return d.toLocaleString('ar-SA',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
if(!sessionStorage.getItem('teacherPlatformSessionStart')){
 sessionStorage.setItem('teacherPlatformSessionStart',Date.now());
}
function persistUsage(){
 const start=Number(sessionStorage.getItem('teacherPlatformSessionStart')||Date.now());
 const elapsed=Math.floor((Date.now()-start)/1000);
 const total=Number(localStorage.getItem('teacherPlatformUsageSeconds')||0)+elapsed;
 localStorage.setItem('teacherPlatformUsageSeconds',total);
 sessionStorage.setItem('teacherPlatformSessionStart',Date.now());
}
window.addEventListener('pagehide',persistUsage);
setInterval(persistUsage,30000);

function sortStudents(c){
 if(!data[c].students.length)return;
 if(!confirm('هل تريد ترتيب الطلاب أبجديًا؟ سيتم الحفاظ على بيانات كل طالب معه.'))return;
 // تحويل سجل الحضور من فهارس إلى أسماء ثم إعادته بعد الترتيب
 const oldStudents=[...data[c].students];
 const attendance=data[c].attendance;
 const namedAttendance={};
 Object.keys(attendance).forEach(date=>{
   namedAttendance[date]={};
   oldStudents.forEach((s,i)=>{if(attendance[date][i])namedAttendance[date][s.name]=attendance[date][i];});
 });
 data[c].students.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 Object.keys(attendance).forEach(date=>{
   const rebuilt={};
   data[c].students.forEach((s,i)=>{if(namedAttendance[date][s.name])rebuilt[i]=namedAttendance[date][s.name];});
   attendance[date]=rebuilt;
 });
 recalc(c);save();renderContent(c);
}

}

ts.length}</div><div>عدد أيام الحضور المسجلة: ${Object.keys(data[c].attendance).length}</div><div>آخر تعديل: <span id="lastModified">${formatDateTime(localStorage.getItem('teacherPlatformLastModified'))}</span></div></div><div style="margin-top:14px;padding:15px;background:#f0f6f4;border-radius:12px;text-align:center"><b>⏱️ إجمالي زمن استخدام التطبيق</b><div id="usageTimer" style="font-size:22px;font-weight:bold;margin-top:10px;direction:rtl">${formatDuration(getUsageSeconds())}</div><div class="sub">يُحسب الوقت التراكمي الذي تقضيه في استخدام التطبيق.</div></div></div></div>`}

let syncTimer=null;
function queueAutoSync(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    try{
      // لا نسجل «آخر مزامنة» إلا بعد رفع فعلي ناجح إلى Google Drive.
      if(!localStorage.getItem('teacherPlatformDriveFileId')) return;
      pendingDriveAction='upload';
      requestDriveToken(false);
    }catch(e){
      console.error('Auto sync failed',e);
    }
  },900);
}
function toggleAutoSync(){
  autoSyncEnabled=!autoSyncEnabled;

  if(btn){btn.textContent=autoSyncEnabled?'إيقاف المزامنة التلقائية':'تفعيل المزامنة التلقائية';btn.className=autoSyncEnabled?'':'secondary';}

function startUsageTimer(){

function exportBackup(){
 const payload={app:'منصة المعلم',version:'1.0',exportedAt:new Date().toISOString(),data:data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='teacher_platform_backup_'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
}
function importBackup(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=JSON.parse(reader.result);
   if(!obj.data)throw new Error('invalid');
   data=obj.data;
   classes.forEach(c=>{data[c]??={students:[],attendance:{}};data[c].students??=[];data[c].attendance??={};});
   save();alert('تم استيراد البيانات بنجاح');
   home();
  }catch(e){alert('ملف النسخة الاحتياطية غير صالح.');}
 };
 reader.readAsText(file,'UTF-8');
}

function classReport(c){

}

 if(i==='')return;const s=data[c].students[i],mem=s.mem||[];s.short??=[0,0,0,0];
 let body=`<table><tbody><tr><th>اسم الطالب</th><td>${s.name}</td></tr><tr><th>الصف</th><td>${c}</td></tr><tr><th>الغياب</th><td>${s.abs||0}</td></tr><tr><th>التأخر</th><td>${s.late||0}</td></tr>${mem.map((v,x)=>`<tr><th>الحفظ ${x+1}</th><td>${v}/10</td></tr>`).join('')}<tr><th>مجموع الحفظ</th><td>${mem.reduce((a,b)=>a+b,0)}/60</td></tr>${s.short.map((v,x)=>`<tr><th>الاختبار القصير ${x+1}</th><td>${v}/10</td></tr>`).join('')}<tr><th>الاختبار الأول</th><td>${s.t1||0}/100</td></tr><tr><th>الاختبار الثاني</th><td>${s.t2||0}/100</td></tr></tbody></table>`;

home();

<style>
.behavior-btn{min-width:58px;padding:8px 9px;font-weight:bold;background:#eef4f2;color:#17332d;border:1px solid var(--line)}
.behavior-btn:hover{background:#176b5b;color:#fff}.private-note-btn{background:#304f88}.bulk-card{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.bulk-card select,.bulk-card input{width:auto;min-width:150px}.report-chart{display:flex;align-items:flex-end;gap:4px;height:240px;padding:12px;border:1px solid #ccc;margin:18px 0;background:#fafafa;direction:ltr}.report-bar{flex:1;min-width:10px;position:relative;border-radius:5px 5px 0 0}.report-bar span{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%) rotate(-55deg);transform-origin:top;white-space:nowrap;font-size:9px;color:#111}.report-bar b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#111}
</style><script>
const behaviorFields=[['privateNote','ملاحظات خاصة'],['late','تأخر'],['disruptive','مشاغب'],['talking','يتكلم'],['inattentive','عدم انتباه'],['noBook','بدون كتاب'],['noMushaf','بدون مصحف'],['notWriting','لا يكتب معنا']];
const gradeFields=[...[1,2,3,4,5,6].map((n,i)=>({key:'mem'+i,label:'حفظ '+n,max:10})),...[1,2,3,4].map((n,i)=>({key:'short'+i,label:'اختبار قصير '+n,max:10})),{key:'t1',label:'اختبار 1',max:100},{key:'t2',label:'اختبار 2',max:100}];
function ensureStudentExtras(s){s.privateNote??='';s.behaviors??={};behaviorFields.slice(1).forEach(([k])=>s.behaviors[k]??=[]);s.mem??=[null,null,null,null,null,null];s.short??=[null,null,null,null]}
classes.forEach(c=>data[c].students.forEach(ensureStudentExtras));
function schoolPeriod(d=new Date()){const m=d.getHours()*60+d.getMinutes(),p=[[420,465,'الأولى'],[465,510,'الثانية'],[510,555,'الثالثة'],[575,620,'الرابعة'],[620,665,'الخامسة'],[665,710,'السادسة'],[710,755,'السابعة']],x=p.find(a=>m>=a[0]&&m<a[1]);return x?x[2]:'خارج وقت الحصة'}
function arabicDateTime(iso){const d=new Date(iso),day=d.toLocaleDateString('ar-SA',{weekday:'long',calendar:'gregory',numberingSystem:'latn'}),date=d.toLocaleDateString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'}),time=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}).replace('AM','ص').replace('PM','م');return `${day} ${date} — ${time}`}
function behaviorCount(s,k){ensureStudentExtras(s);return s.behaviors[k].length}
function addBehavior(c,i,k){const s=data[c].students[i];ensureStudentExtras(s);const now=new Date();s.behaviors[k].push({at:now.toISOString(),period:schoolPeriod(now)});save();renderContent(c)}
function editPrivateNote(c,i){const s=data[c].students[i];ensureStudentExtras(s);const n=prompt('ملاحظات خاصة بالطالب — لن تظهر في التقارير:',s.privateNote||'');if(n===null)return;s.privateNote=n;save();renderContent(c)}
function gradeGet(s,key){return key.startsWith('mem')?s.mem[+key.slice(3)]:key.startsWith('short')?s.short[+key.slice(5)]:s[key]}
function gradeSet(s,key,v){if(key.startsWith('mem'))s.mem[+key.slice(3)]=v;else if(key.startsWith('short'))s.short[+key.slice(5)]=v;else s[key]=v}
function bulkGrade(c,mode){const key=document.getElementById('bulkField').value,val=document.getElementById('bulkValue').value,f=gradeFields.find(x=>x.key===key);if(mode!=='clear'&&(val===''||isNaN(val))){alert('أدخل درجة صحيحة أولًا.');return}if(mode==='clear'&&!confirm('هل تريد تفريغ هذه الخانة لجميع الطلاب؟'))return;data[c].students.forEach(s=>{ensureStudentExtras(s);const old=gradeGet(s,key);if(mode==='all')gradeSet(s,key,Math.max(0,Math.min(f.max,+val)));if(mode==='empty'&&(old==null||old===''))gradeSet(s,key,Math.max(0,Math.min(f.max,+val)));if(mode==='clear')gradeSet(s,key,null)});save();renderContent(c)}
function clearOneStudent(c){const i=+document.getElementById('clearStudent').value,key=document.getElementById('clearField').value,s=data[c].students[i];if(!s)return;ensureStudentExtras(s);gradeSet(s,key,null);save();renderContent(c)}
function gradesView(c){const students=data[c].students;students.forEach(ensureStudentExtras);const opts=gradeFields.map(f=>`<option value="${f.key}">${f.label}</option>`).join('');return `<div class="toolbar card"><input id="studentName" placeholder="اسم الطالب"><button onclick="addStudent('${c}')">＋ إضافة طالب</button><input id="studentSearch" placeholder="🔎 البحث عن طالب" oninput="filterStudents('${c}',this.value)"></div><div class="card bulk-card"><b>⚙️ إدارة الدرجات</b><select id="bulkField">${opts}</select><input id="bulkValue" type="number" placeholder="الدرجة"><button onclick="bulkGrade('${c}','all')">تعبئة الجميع</button><button class="secondary" onclick="bulkGrade('${c}','empty')">تعبئة الخانات الفارغة</button><button class="danger" onclick="bulkGrade('${c}','clear')">تفريغ الخانة للجميع</button></div><div class="card bulk-card"><b>👤 تفريغ درجة طالب محدد</b><select id="clearStudent">${students.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('')}</select><select id="clearField">${opts}</select><button class="secondary" onclick="clearOneStudent('${c}')">تفريغ الدرجة</button></div><div class="table-wrap">${renderTable(c,students)}</div>`}
function renderTable(c,students){if(!students.length)return '<div class="empty">لا يوجد طلاب بعد — أضف أول طالب من الأعلى.</div>';return `<table><thead><tr><th>م</th><th class="name-cell">اسم الطالب</th><th>ملاحظات 🔒</th>${behaviorFields.slice(1).map(x=>`<th>${x[1]}</th>`).join('')}<th>غياب</th>${[1,2,3,4,5,6].map(x=>`<th>حفظ ${x}</th>`).join('')}<th>المجموع /60</th>${[1,2,3,4].map(x=>`<th>اختبار قصير ${x}</th>`).join('')}<th>مجموع القصيرة</th><th>اختبار 1</th><th>اختبار 2</th><th>المجموع /300</th><th>حذف</th></tr></thead><tbody>${students.map((s,i)=>{ensureStudentExtras(s);const total=s.mem.reduce((a,b)=>a+(+b||0),0),st=s.short.reduce((a,b)=>a+(+b||0),0),g=total+st+(+s.t1||0)+(+s.t2||0);return `<tr><td>${i+1}</td><td class="name-cell">${s.name}</td><td><button class="private-note-btn" onclick="editPrivateNote('${c}',${i})">📝</button></td>${behaviorFields.slice(1).map(([k])=>`<td><button class="behavior-btn" onclick="addBehavior('${c}',${i},'${k}')">${behaviorCount(s,k)}</button></td>`).join('')}<td>${s.abs||0}</td>${s.mem.map((v,x)=>`<td><input type="number" min="0" max="10" value="${v??''}" onchange="setMem('${c}',${i},${x},this.value)"></td>`).join('')}<td>${total}</td>${s.short.map((v,x)=>`<td><input type="number" min="0" max="10" value="${v??''}" onchange="setShort('${c}',${i},${x},this.value)"></td>`).join('')}<td>${st}</td><td><input type="number" min="0" max="100" value="${s.t1??''}" onchange="setField('${c}',${i},'t1',this.value)"></td><td><input type="number" min="0" max="100" value="${s.t2??''}" onchange="setField('${c}',${i},'t2',this.value)"></td><td>${g}</td><td><button class="danger" onclick="removeStudent('${c}',${i})">حذف</button></td></tr>`}).join('')}</tbody></table>`}
function studentScore(s){ensureStudentExtras(s);return s.mem.reduce((a,b)=>a+(+b||0),0)+s.short.reduce((a,b)=>a+(+b||0),0)+(+s.t1||0)+(+s.t2||0)}
function colorFor(rank,n){const t=n<=1?0:rank/(n-1),a=[0,92,255],b=[255,221,0],d=[230,45,45],x=t<.5?t*2:(t-.5)*2,p=t<.5?a:b,q=t<.5?b:d;return `rgb(${p.map((v,i)=>Math.round(v+(q[i]-v)*x)).join(',')})`}
function classReport(c,only=''){const students=data[c].students.map(s=>({s,score:only?Number(gradeGet(s,only)||0):studentScore(s)})).sort((a,b)=>b.score-a.score),max=only?(gradeFields.find(f=>f.key===only).max):300,avg=students.length?students.reduce((a,x)=>a+x.score,0)/students.length:0,label=only?`تقرير درجات الطلاب — ${gradeFields.find(f=>f.key===only).label}`:'تقرير الصف الكامل — ترتيب حسب المتوسط العام';const rows=students.map((x,i)=>`<tr><td>${i+1}</td><td>${x.s.name}</td><td style="background:${colorFor(i,students.length)};font-weight:bold">${x.score.toFixed(1)}</td></tr>`).join(''),chart=students.map((x,i)=>`<div class="report-bar" style="height:${Math.max(3,Math.min(100,x.score/max*100))}%;background:${colorFor(i,students.length)}"><b>${x.score.toFixed(1)}</b><span>${x.s.name}</span></div>`).join('');openReport(c+' — '+label,`<div class="summary"><div>متوسط الفصل: ${avg.toFixed(2)}</div><div>عدد الطلاب: ${students.length}</div></div><table><thead><tr><th>الترتيب</th><th>الطالب</th><th>${only?'الدرجة':'المجموع /300'}</th></tr></thead><tbody>${rows}</tbody></table><h3>الرسم البياني للدرجات</h3><div class="report-chart">${chart}</div>`)}
function reportsView(c){return `<div class="report-choice"><button class="report-card-btn" onclick="classReport('${c}')"><h3>📊 تقرير الصف كاملًا</h3><div class="sub">ترتيب، متوسط، ألوان متدرجة ورسم بياني.</div></button><div class="card"><h3>📋 تقرير خانة واحدة لجميع الطلاب</h3><select id="singleReportField">${gradeFields.map(f=>`<option value="${f.key}">${f.label}</option>`).join('')}</select><button style="margin-top:10px" onclick="classReport('${c}',document.getElementById('singleReportField').value)">إنشاء التقرير</button></div></div><div class="card"><h3>👤 تقرير طالب</h3><select onchange="studentReport('${c}',this.value)"><option value="">اختر الطالب</option>${data[c].students.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('')}</select></div>`}
</script>
